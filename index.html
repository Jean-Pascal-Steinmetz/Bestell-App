<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestell App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <script src="array.js" defer></script>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <span class="navbar-icon">
          <img src="./assets/icons/header.svg" alt="Bestell App Logo" />
          <img src="./assets/icons/menu.svg" alt=""
        /></span>
      </nav>
      <div class="header-backround">
        <img src="./assets/img/header-backround.png" alt="Tisch voller Essen" />
        <div class="company-logo">
          <img src="./assets/img/logo.png" alt="Firmen Logo" />
        </div>
      </div>

      <div class="headline">
        <h1 class="logo">
            <span class="logo-orange">Burger</span><span class="logo-dark">House</span>
        </h1>
        <p>Best Burger in Town</p>
      </div>
    </header>
    <div class="page-layout">
      <div class="category">
        <div class="category-header">
          <div class="icon">
            <img src="./assets/icons/burger.png" alt="Burger Icon" />
          </div>
          <h2>Burger & Sandwiches</h2>
        </div>

        <div class="item-list" id="itemList"></div>
      </div>

      <div id="basketContent"></div>
    </div>
    <footer>
      <div class="footer-content">
        <img src="./assets/icons/copyright.svg" alt="Copyright Logo" />
        <img src="./assets/icons/2025 BurgerHouse.svg" alt="2025 BurgerHouse" />
      </div>
      <img src="./assets/icons/Imprint.svg" alt="Imprint" />
      <img src="./assets/icons/cookies.svg" alt="Cookies" />
    </footer>
  </body>
</html>
